name: pstore
description: Uses pserver and introduces higher level abstractions for executing edit operations, refreshing snapshots etc.
version: 1.0.0

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  protobuf: ^2.1.0
  fixnum: ^1.0.0
  hive: ^1.4.1
  pserver:
    path: ../pserver
  pdelta:
    path: ../pdelta